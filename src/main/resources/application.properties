spring.application.name=order-platform

# Overridden by SPRING_DATASOURCE_* env vars in docker compose.
spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=orders
spring.datasource.password=orders

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Observability: Actuator + Micrometer Prometheus ---
# Allowlist: everything not named here (env, beans, heapdump, threaddump, loggers) stays 404.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.metrics.tags.application=${spring.application.name}
# Emits _bucket series so PromQL histogram_quantile() can compute real p95/p99.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Bounds the generated bucket ladder; without these it spans 1ms-30s in ~75 buckets
# per uri/status, which is mostly empty range for a local JSON API.
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=5s
# Extra boundaries added on top of the ladder, for SLO-aligned queries.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s
