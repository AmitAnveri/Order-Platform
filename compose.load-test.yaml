name: order-platform-loadtest

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5433:5432"
    volumes:
      - test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/orderdb
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:v3.6.0
    depends_on:
      - app
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - test_promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9091:9090"

  seed:
    image: python:3.13-alpine
    depends_on:
      - app
    volumes:
      - ./scripts/seed_load_test.py:/seed.py:ro
      - seed_state:/state
    command: ["python", "-u", "/seed.py"]
    restart: "no"

volumes:
  test_pgdata:
  test_promdata:
  seed_state:
